name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── phone-ui (차량 앱 내장 웹 UI) ──────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: phone-ui/package-lock.json

      - name: Build phone-ui
        run: npm --prefix phone-ui ci && npm --prefix phone-ui run build

      # ── 차량용 Android APK ─────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build car APK
        run: ./build.sh
        env:
          BYD_CAMERA_SIGNING_MODE: debug

      - name: Rename car APK
        run: cp build/byd-dashcam-debug.apk build/BYD-BlackBox-Car-${{ github.ref_name }}.apk

      # ── Release signing (optional) ──────────────────────────────────────
      # To enable release signing:
      # 1. Generate: keytool -genkeypair -keystore byd-camera-release.jks \
      #              -alias byd-camera-release -keyalg RSA -validity 10000
      # 2. Add GitHub Secrets:
      #      RELEASE_KEYSTORE_BASE64  (base64 -i byd-camera-release.jks)
      #      RELEASE_KEYSTORE_PASSWORD
      # 3. Uncomment steps below, comment out the debug build above.
      #
      # - name: Prepare release keystore
      #   run: |
      #     mkdir -p ${GITHUB_WORKSPACE}_build_secret
      #     echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d \
      #       > ${GITHUB_WORKSPACE}_build_secret/byd-camera-release.jks
      #     echo "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
      #       > ${GITHUB_WORKSPACE}_build_secret/byd-camera-release.password
      # - name: Build car APK (release-signed)
      #   run: ./build.sh
      #   env:
      #     BYD_CAMERA_SIGNING_MODE: release
      #     BYD_CAMERA_RELEASE_SIGNING_DIR: ${{ github.workspace }}_build_secret
      # - name: Rename car APK
      #   run: cp build/byd-dashcam.apk build/BYD-BlackBox-Car-${{ github.ref_name }}.apk

      # ── 폰앱 Flutter Android APK ───────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter dependencies
        run: flutter pub get
        working-directory: mobile

      - name: Build phone app APK
        run: flutter build apk --debug
        working-directory: mobile

      - name: Rename phone APK
        run: cp mobile/build/app/outputs/flutter-apk/app-debug.apk build/BYD-BlackBox-Phone-${{ github.ref_name }}.apk

      # ── GitHub Release ─────────────────────────────────────────────────
      - name: Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            --generate-notes \
            --title "${{ github.ref_name }}" \
            "build/BYD-BlackBox-Car-${{ github.ref_name }}.apk" \
            "build/BYD-BlackBox-Phone-${{ github.ref_name }}.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
